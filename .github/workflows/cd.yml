name: Build, attest & deploy Streamlit apps

on:
  push:
    branches: [main]

env:
  AWS_REGION: ap-northeast-1
  ECR_REPO: streamlit-suite
  IMAGE_TAG: ${{ github.sha }}
  APP_FILES: '["app1.py","app2.py"]'

permissions: {}

jobs:
  configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      enabled: ${{ steps.aws.outputs.enabled }}
    steps:
      - name: Validate optional AWS workload identity
        id: aws
        shell: bash
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          if [[ -z "$AWS_ROLE_ARN" ]]; then
            echo "::notice::AWS delivery is disabled. Set the repository variable AWS_ROLE_ARN after choosing the target AWS account."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$AWS_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/.+$ ]]; then
            echo "::error::AWS_ROLE_ARN must be a complete IAM role ARN."
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

  build:
    needs: configuration
    if: needs.configuration.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    environment: production
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    outputs:
      image-digest: ${{ steps.image.outputs.digest }}
      repository-uri: ${{ steps.image.outputs.repository-uri }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2
      - name: Build and push immutable image
        id: image
        shell: bash
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          repository_uri="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}"
          image="${repository_uri}:${IMAGE_TAG}"
          docker build --pull --tag "$image" .
          docker push "$image"
          digest="$(aws ecr describe-images \
            --repository-name "$ECR_REPO" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          test "${digest#sha256:}" != "$digest"
          {
            echo "image=$image"
            echo "repository-uri=$repository_uri"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.image.outputs.image }}
          format: spdx-json
          output-file: image.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest image build provenance in ECR
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ steps.image.outputs.repository-uri }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Attest image SBOM in ECR
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ steps.image.outputs.repository-uri }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: image.spdx.json
          push-to-registry: true
      - name: Preserve SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-sbom-${{ github.sha }}
          path: image.spdx.json
          retention-days: 90

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 1
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.7

      - run: terraform -chdir=infra init
      - run: terraform -chdir=infra apply -auto-approve \
               -var="image_tag=${IMAGE_TAG}" \
               -var="app_files=${APP_FILES}"
